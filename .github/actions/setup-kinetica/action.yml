name: Setup Kinetica toolchain
description: JDK, Node and the Kotlin Toolchain caches for building this repo.

inputs:
  java-version:
    description: JDK used by Kotlin Toolchain, Gradle and packaged JVM applications.
    required: false
    # Match the Toolchain's JDK so it can use JAVA_HOME without downloading another JDK.
    default: "25"
  setup-kotlin:
    description: Set up Kotlin Toolchain and its caches; cached-artifact consumers can skip it.
    required: false
    default: "true"
  cache-konan:
    description: Cache Kotlin/Native data for native builds.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Set up Kotlin Toolchain
      if: inputs.setup-kotlin == 'true'
      uses: Heapy/setup-ktc@e0a603c477110083db0b44f302deb188d4991ea0 # v1.1.0
      with:
        version: auto
        cache-konan: ${{ inputs.cache-konan }}

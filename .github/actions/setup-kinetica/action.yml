name: Setup Kinetica toolchain
description: JDK, Node and the Kotlin Toolchain caches for building this repo.

inputs:
  setup-kotlin:
    description: Restore the Kotlin Toolchain caches; cached-artifact consumers can skip it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    # The ./kotlin wrapper provisions the CLI distribution, its JRE and the dependency cache
    # into the toolchain's shared cache dir — one entry covers all of them. Only the OS-specific
    # path exists on a given runner; the other is silently skipped.
    - name: Cache Kotlin Toolchain state
      if: inputs.setup-kotlin == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/JetBrains/Kotlin
          ~/Library/Caches/JetBrains/Kotlin
        key: kinetica-kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', 'common.module-template.yaml', '**/module.yaml') }}
        restore-keys: |
          kinetica-kotlin-${{ runner.os }}-

settings:
  kotlin:
    version: 2.4.10
    languageVersion: 2.4
    apiVersion: 2.4
    serialization: json
    freeCompilerArgs:
      - -Xexpect-actual-classes
    compilerPlugins:
      - id: io.heapy.kinetica.compiler
        dependency: io.heapy.kinetica:kinetica-compiler:0.3.0

repositories:
  # Serves two roles: the compiler plugin is consumed from here, and published modules can be
  # staged here with `./kotlin publish mavenLocal` to inspect a publication before Central.
  - id: mavenLocal
    url: mavenLocal
    publish: true

settings@android:
  android:
    namespace: io.heapy.kinetica

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1

test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1

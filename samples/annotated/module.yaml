product: jvm/app

apply:
  - ../../common.module-template.yaml

repositories:
  - mavenLocal

dependencies:
  - ../../kinetica-runtime
  - ../../kinetica-test

settings:
  jvm:
    mainClass: app.annotated.MainKt
  kotlin:
      # PSI rewrites and aggregate registrations require the complete source set.
      compileIncrementally: false
      compilerPlugins:
        - id: io.heapy.kinetica.compiler
          dependency: io.heapy.kinetica:kinetica-compiler:0.4.0
          options:
            moduleId: annotated
            sourcePipeline: psi
            serverSourceSet: serverMain
            clientSourceSet: clientMain

description: "Annotated component smoke sample compiled through the Kinetica compiler plugin."

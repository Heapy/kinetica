product:
  type: kmp/lib
  platforms: [jvm, js]

apply:
  - ../common.module-template.yaml
  - ../publish.module-template.yaml

dependencies:
  # exported, like every other battery: public signatures here take ComponentScope
  # (MarkdownRenderer.kt:14, CodeHighlight.kt:111), so consumers cannot compile against them
  # without the runtime on their compile classpath.
  - ../kinetica-runtime: exported

description: "Markdown parser and renderer emitting Kinetica host nodes — powers the documentation site."

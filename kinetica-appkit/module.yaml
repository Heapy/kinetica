product:
  type: kmp/lib
  platforms: [macosArm64]

apply:
  - ../common.module-template.yaml
  - ../publish.module-template.yaml

settings:
  kotlin:
    optIns:
      - kotlin.concurrent.atomics.ExperimentalAtomicApi

dependencies:
  - ../kinetica-application: exported
  - ../kinetica-runtime: exported
  - ../kinetica-render-core: exported

description: "macOS AppKit renderer for Kinetica applications."

product: jvm/lib

apply:
  - ../publish.module-template.yaml

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true

settings:
  jvm:
    # The plugin jar is loaded into the consumer's Kotlin compile daemon, whose JVM this project
    # does not control — a JDK 17 daemon (the common case for Android and Spring builds) cannot
    # load the toolchain's default Java 21 bytecode and fails with UnsupportedClassVersionError.
    release: 17
  kotlin:
    version: 2.4.10
    languageVersion: 2.4
    apiVersion: 2.4
    optIns:
      - org.jetbrains.kotlin.compiler.plugin.ExperimentalCompilerApi
      - org.jetbrains.kotlin.ir.symbols.UnsafeDuringIrConstructionAPI

dependencies:
  - org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.10: compile-only

test-dependencies:
  - ../kinetica-runtime
  - org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.10

description: "Kinetica compiler-plugin contract module for K2 responsibilities and generated metadata."
